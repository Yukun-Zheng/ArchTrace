name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src/archtrace

      - name: Pytest
        run: pytest

  python-probe-agent-310:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile standalone probe files
        run: >-
          python -m py_compile
          src/archtrace/runtime/python_probe_agent.py
          src/archtrace/runtime/python_probe_driver.py
          tests/compat/probe_agent_smoke.py
          benchmarks/scenarios/robotwin_xpolicy_contract.py

      - name: Python 3.10 probe smoke
        run: python tests/compat/probe_agent_smoke.py

  pytorch-runtime:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ArchTrace
        run: python -m pip install -e '.[dev]'

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: PyTorch runtime tests
        run: pytest tests/test_pytorch_runtime.py tests/test_benchmark_runtime.py -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck web
        run: npm run typecheck

      - name: Build web
        run: npm run build
