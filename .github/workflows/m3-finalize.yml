name: M3 Query Finalizer

on:
  push:
    branches: [m3-explorer-query]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-explorer-query
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize formatting
        run: |
          python -m pip install 'ruff==0.16.7'
          ruff check src tests --fix
          ruff format src tests
          git rm -f .github/workflows/m3-finalize.yml
          if [ -f .github/workflows/m3-one-shot-format.yml ]; then
            git rm -f .github/workflows/m3-one-shot-format.yml
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github/workflows
          git commit -m 'Normalize M3 explorer query slice' || true
          git push origin HEAD:m3-explorer-query

  python:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-explorer-query
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/archtrace
      - name: Pytest
        run: pytest

  pytorch:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-explorer-query
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'torch>=2.7,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: PyTorch runtime regression
        run: pytest tests/test_runtime_pytorch.py

  merge:
    needs: [python, pytorch]
    runs-on: ubuntu-latest
    steps:
      - name: Squash merge PR 18
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge 18 --repo Yukun-Zheng/ArchTrace --squash \
            --subject 'M3: add lazy hierarchical explorer query contract' \
            --body 'Add bounded hierarchical drill-down, run-filtered search and lineage, source panes, breadcrumbs, and deep-link state for the frontend-neutral explorer query layer.'
