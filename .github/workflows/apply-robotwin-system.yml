name: Apply RoboTwin system patch

on:
  push:
    branches: [runtime-robotwin-system]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified chunked patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/robotwin-parts/00 ]; then
            echo "No staging payload; nothing to apply."
            exit 0
          fi
          cat .github/robotwin-parts/[0-9][0-9] > /tmp/robotwin-system.patch.gz.b64
          echo "7113bad397fdcbe4074930b205b5623c1826e9bcf98a19ee69e98f107c161cbd  /tmp/robotwin-system.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/robotwin-system.patch.gz.b64 > /tmp/robotwin-system.patch.gz
          echo "dd47eac761de03ca67ff0b63896f452469faf5237e9129350013a94fc801e5d3  /tmp/robotwin-system.patch.gz" | sha256sum -c -
          gzip -dc /tmp/robotwin-system.patch.gz > /tmp/robotwin-system.patch
          git apply --check /tmp/robotwin-system.patch
          git apply /tmp/robotwin-system.patch
          rm -rf .github/robotwin-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M3.5: add cross-runtime RoboTwin system benchmark"
          git push
