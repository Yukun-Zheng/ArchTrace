name: M3 One-Shot Format

on:
  push:
    branches: [m3-explorer-query]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-explorer-query
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format
        run: |
          python -m pip install 'ruff==0.16.7'
          ruff check src tests --fix
          ruff format src tests
          git rm .github/workflows/m3-one-shot-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'Format M3 explorer query slice with Ruff'
          git push origin HEAD:m3-explorer-query
