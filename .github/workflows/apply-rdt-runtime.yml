name: Apply RDT runtime patch
on:
  push:
    branches: [runtime-rdt]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch
        run: |
          git apply --check .github/runtime-rdt.patch
          git apply --index .github/runtime-rdt.patch
          git rm .github/runtime-rdt.patch .github/workflows/apply-rdt-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'M3.5: support declarative constructor objects and RDT runtime target'
          git push origin HEAD:runtime-rdt
